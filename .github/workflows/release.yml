name: Release

# Manual trigger: Actions tab -> Release -> Run workflow.
# Builds the macOS arm64 app, makes patches from every earlier release's
# dylib, creates the GitHub release, and publishes latest.json + patches to
# the `updates` branch (see scripts/release.ts).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (1.6.0 -> 1.6.1 for patch)
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14 # Apple Silicon
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6

      - run: brew install bsdiff

      - run: npm ci

      - name: Build, patch and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: deno run -A scripts/release.ts ${{ inputs.bump }} --publish

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deno.json
          git commit -m "chore: release $(jq -r .version deno.json)"
          git push origin HEAD:main
